<!-- Renamed ID to avoid confusion, now acts as a wrapper -->
<div id="enquiry-inline-wrapper">
    <div id="enquiry-popup-content">
        <div class="card">
            <!-- Close button is hidden via CSS -->
            <button id="close-popup-btn" title="Close">&times;</button>
            <div class="card-header">
                <h2>How can we help?</h2>
                <p class="lead">No project is too big. Let us know what's on your mind.</p>
            </div>
            <form id="enquiryForm" class="enquiry-form">

                <!-- Row 1: Name -->
                <div class="form-group">
                    <input class="input" type="text" id="fname" name="fname" placeholder="" required>
                    <label class="form-label" for="fname">First Name</label>
                </div>
                <div class="form-group">
                    <input class="input" type="text" id="lname" name="lname" placeholder="" required>
                    <label class="form-label" for="lname">Last Name</label>
                </div>

                <!-- Row 2: Email -->
                <div class="form-group col-full">
                    <input class="input" type="email" id="email" name="email" placeholder="" required>
                    <label class="form-label" for="email">Email Address</label>
                </div>

                <!-- Row 3: Phone (below Email) -->
                <div class="form-group col-full" style="position:relative;">
                    <div class="phone-input-group">
                        <button type="button" id="phone-country-btn" class="country-toggle"
                            aria-label="Select country code, currently United Arab Emirates +971"
                            aria-haspopup="listbox" aria-expanded="false">
                            <span id="phone-selected-flag" class="flag" aria-hidden="true">🇦🇪</span>
                            <span id="phone-selected-code" class="code">+971</span>
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m6 9 6 6 6-6" />
                            </svg>
                        </button>

                        <input type="hidden" name="phone_country_code" id="phone-hidden-code" value="+971">

                        <input type="tel" id="phone" name="phone" autocomplete="tel-national" placeholder="50 123 4567"
                            class="phone-number-input" required>
                        <label class="phone-form-label" for="phone">Phone</label>

                        <div id="phone-country-dropdown" class="phone-dropdown">
                            <div class="phone-dropdown-search-wrapper">
                                <input type="text" id="phone-country-search" class="phone-dropdown-search"
                                    placeholder="Search countries..." autocomplete="off">
                            </div>
                            <ul id="phone-country-list" class="phone-country-list" role="listbox"></ul>
                        </div>
                    </div>
                </div>

                <!-- Row 3: Company + Role -->
                <div class="form-group">
                    <input class="input" type="text" id="company" name="company" placeholder="" required>
                    <label class="form-label" for="company">Company</label>
                </div>

                <div class="form-group">
                    <select class="input" id="role" name="role" required>
                        <option value="" disabled selected></option>
                        <option value="client">Client / Buyer</option>
                        <option value="interior_designer">Interior Designer</option>
                        <option value="contractor">Contractor</option>

    (function forceInputWidths() {
        function applyWidths() {
            var wrapper = document.getElementById('enquiry-popup-content');
            if (!wrapper) return;

            // Force all regular inputs, selects, textareas
            wrapper.querySelectorAll('.input, input, select, textarea').forEach(function (el) {
                if (el.classList.contains('phone-number-input')) return; // handled separately
                el.style.setProperty('width', '100%', 'important');
                el.style.setProperty('min-width', '0', 'important');
                el.style.setProperty('max-width', '100%', 'important');
                el.style.setProperty('box-sizing', 'border-box', 'important');
            });

            // Force phone number input (flex child needs width: 0 to shrink properly)
            wrapper.querySelectorAll('.phone-number-input').forEach(function (el) {

                el.style.setProperty('min-width', '0', 'important');
                el.style.setProperty('max-width', '100%', 'important');
            });

            // Force the grid itself to fill 100%
            wrapper.querySelectorAll('.enquiry-form').forEach(function (el) {
                el.style.setProperty('width', '100%', 'important');
            });
        }

        // Run immediately (sync, before Elementor post-processing)
        applyWidths();
        // Run again after DOM ready (catches Elementor lazy rendering)
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyWidths);
        }

        window.addEventListener('load', applyWidths);

        ];

        const phoneSelectorBtn = document.getElementById('phone-country-btn');
        const phoneDropdown = document.getElementById('phone-country-dropdown');
        const phoneSearchInput = document.getElementById('phone-country-search');
        const phoneCountryList = document.getElementById('phone-country-list');
        const phoneSelectedFlag = document.getElementById('phone-selected-flag');
        const phoneSelectedCode = document.getElementById('phone-selected-code');
        const phoneHiddenInput = document.getElementById('phone-hidden-code');
        const phoneNumberInput = document.getElementById('phone');

        if (!phoneSelectorBtn) return;

        let phoneDropdownOpen = false;

        function renderPhoneCountries(filterText) {
            filterText = (filterText || '').toLowerCase();
            phoneCountryList.innerHTML = '';
            const filtered = phoneCountries.filter(c =>
                c.name.toLowerCase().includes(filterText) || c.code.includes(filterText)
            );
            if (filtered.length === 0) {
                phoneCountryList.innerHTML = '<li class="phone-no-results">No countries found</li>';
                return;
            }
            filtered.forEach(function (country) {
                const li = document.createElement('li');
                li.className = 'phone-country-item';
                li.setAttribute('role', 'option');
                li.innerHTML =
                    '<span class="phone-country-item-left">' +
                    '<span class="flag">' + country.flag + '</span>' +
                    '<span class="phone-country-item-name">' + country.name + '</span>' +
                    '</span>' +
                    '<span class="phone-country-item-code">' + country.code + '</span>';
                li.addEventListener('click', function () { selectPhoneCountry(country); });
                phoneCountryList.appendChild(li);
            });
        }

        function selectPhoneCountry(country) {
            phoneSelectedFlag.textContent = country.flag;
            phoneSelectedCode.textContent = country.code;
            phoneHiddenInput.value = country.code;
            phoneSelectorBtn.setAttribute('aria-label', 'Select country code, currently ' + country.name + ' ' + country.code);
            closePhoneDropdown();
            phoneNumberInput.focus();
        }

        function openPhoneDropdown() {
            phoneDropdownOpen = true;
            phoneDropdown.classList.add('open');
            phoneSelectorBtn.setAttribute('aria-expanded', 'true');
            renderPhoneCountries();
            phoneSearchInput.value = '';
            phoneSearchInput.focus();
        }

        function closePhoneDropdown() {
            phoneDropdownOpen = false;
            phoneDropdown.classList.remove('open');
            phoneSelectorBtn.setAttribute('aria-expanded', 'false');
        }

        phoneSelectorBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            phoneDropdownOpen ? closePhoneDropdown() : openPhoneDropdown();
        });

        phoneSearchInput.addEventListener('input', function (e) {
            renderPhoneCountries(e.target.value);
        });

        phoneDropdown.addEventListener('click', function (e) { e.stopPropagation(); });

        document.addEventListener('click', function (e) {
            if (!phoneSelectorBtn.contains(e.target) && !phoneDropdown.contains(e.target)) {
                closePhoneDropdown();
            }
        });

        // Phone number auto-formatting (XX XXX XXXX)
        phoneNumberInput.addEventListener('input', function (e) {
            let cleaned = e.target.value.replace(/\D/g, '');
            let parts = [];
            if (cleaned.length > 0) parts.push(cleaned.substring(0, 2));
            if (cleaned.length > 2) parts.push(cleaned.substring(2, 5));
            if (cleaned.length > 5) parts.push(cleaned.substring(5, 9));
            if (cleaned.length > 9) parts.push(cleaned.substring(9));
            e.target.value = parts.join(' ').trim();
        });

        phoneNumberInput.addEventListener('keydown', function (e) {
            if (e.key === 'Backspace') {
                const pos = e.target.selectionStart;
                if (e.target.value.charAt(pos - 1) === ' ') {
                    e.preventDefault();
                    const val = e.target.value;
                    e.target.value = val.substring(0, pos - 2) + val.substring(pos);
                    e.target.setSelectionRange(pos - 2, pos - 2);
                    e.target.dispatchEvent(new Event('input'));
                }
            }
        });

        renderPhoneCountries();
