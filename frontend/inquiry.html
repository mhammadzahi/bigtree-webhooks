<script>
    function initializeEnquiryFeature() {

        const generatePassword = (length = 12) => {
            const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
            let retVal = "";
            for (let i = 0, n = charset.length; i < length; ++i) {
                retVal += charset.charAt(Math.floor(Math.random() * n));
            }
            return retVal;
        };

        const populateUserData = () => {
            if (typeof btAuthObj !== 'undefined' && btAuthObj.is_logged_in === 'yes' && btAuthObj.user_data) {
                const u = btAuthObj.user_data;
                const setVal = (id, val) => {
                    const el = document.getElementById(id);
                    if (el && val) el.value = val;
                };

                setVal('fname', u.fname);
                setVal('lname', u.lname);
                setVal('email', u.email);
                setVal('phone-input', u.phone);
                setVal('company', u.company);
            }
        };

        const processInquiryOrder = async (formDataPayload, password, turnstileToken) => {
            if (typeof btAuthObj === 'undefined') {
                console.error('btAuthObj not found.');
                throw new Error('Configuration error: PHP snippet missing.');
            }

            const formData = new FormData();
            formData.append('action', 'bt_process_inquiry_order');
            formData.append('nonce', btAuthObj.nonce);

            formData.append('fname', formDataPayload.fname);
            formData.append('lname', formDataPayload.lname);
            formData.append('email', formDataPayload.email);
            formData.append('phone', formDataPayload.phone);
            formData.append('company', formDataPayload.company);
            formData.append('project', formDataPayload.project);
            formData.append('project_type', formDataPayload.project_type);
            formData.append('country', formDataPayload.country);

            // Pass the Turnstile token to the backend
            formData.append('cf-turnstile-response', turnstileToken);

            const messageWithSample = formDataPayload.message +
                (formDataPayload.req_sample === 'yes' ? "\n\n[Request Sample: YES]" : "");

            formData.append('message', messageWithSample);

            if (password) {
                formData.append('password', password);
            }

            const response = await fetch(btAuthObj.ajax_url, {
                method: 'POST',
                body: formData
            });

            const result = await response.json();
            if (!result.success) {

        const sendToWebhook = async (formData, password) => {
            try {
                const cartItemElements = document.querySelectorAll('.woocommerce-cart-form__cart-item.cart_item');
                if (!cartItemElements || cartItemElements.length === 0) { throw new Error("Validation: No cart items found."); }

                const cart_items = Array.from(cartItemElements).map(itemEl => {
                    const productElement = itemEl.querySelector('a.remove[data-product_id]');
                    const quantityInput = itemEl.querySelector('.quantity .qty');
                    const productId = productElement ? parseInt(productElement.getAttribute('data-product_id'), 10) : null;
                    const quantity = quantityInput ? quantityInput.value : 0;
                    return { id: productId, quantity: quantity };
                }).filter(item => item.id !== null && !isNaN(item.id));

                if (cart_items.length === 0) { throw new Error("Validation: No product IDs found."); }

                const payload = { ...formData, cart_items };

                if (password) {
                    payload['password'] = password;
                    payload['account_password'] = password;
                }

                const Toast = Swal.mixin({
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 3000,
                    timerProgressBar: true
                });

                Toast.fire({
                    icon: 'info',
                    title: 'Processing request...',
                    timer: 0, // Keep open until fetch finishes
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });

                const response = await fetch('https://app.bigtree-group.com/bt-send-product-enquiry-webhook-v2-1', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', "X-API-Key": window.MySiteSettings.apiKey },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('Webhook Error:', errorData);
                    throw new Error('Failed to send enquiry to external system.');
                }
                return await response.json();

            } catch (error) {
                throw error;
            }
        };

            const btn = document.getElementById('location-selector-btn');
            const dropdown = document.getElementById('location-dropdown');
            const searchInput = document.getElementById('location-search');
            const list = document.getElementById('location-list');
            const flagEl = document.getElementById('location-flag');
            const nameEl = document.getElementById('location-name');
            const hiddenInput = document.getElementById('country');
            if (!btn || !dropdown) return;
            let isOpen = false;

            function renderList(filterText = "") {
                list.innerHTML = "";
                const lower = filterText.toLowerCase();
                const filtered = allCountries.filter(c =>
                    c.name.toLowerCase().includes(lower) || c.code.toLowerCase().includes(lower)
                );
                if (filtered.length === 0) {
                    list.innerHTML = `<li class="no-results">No countries found</li>`;
                    return;
                }
                filtered.forEach(c => {
                    const li = document.createElement('li');
                    li.className = "country-item";
                    li.setAttribute('role', 'option');
                    li.innerHTML = `
                        <span class="country-item-left">
                            <span class="flag">${c.flag}</span>
                            <span class="country-item-name">${c.name}</span>
                        </span>
                        <span class="country-item-code">${c.code}</span>
                    `;
                    li.addEventListener('click', () => {
                        flagEl.textContent = c.flag;
                        flagEl.style.display = 'inline';
                        nameEl.textContent = c.name;
                        hiddenInput.value = c.code;
                        btn.classList.add('has-value');
                        closeDropdown();
                    });
                    list.appendChild(li);
                });
            }

            function openDropdown() {
                isOpen = true;
                dropdown.classList.add('open');
                btn.classList.add('active');
                btn.setAttribute('aria-expanded', 'true');
                renderList();
                searchInput.value = "";
                searchInput.focus();
            }

            function closeDropdown() {
                isOpen = false;
                dropdown.classList.remove('open');
                btn.classList.remove('active');
                btn.setAttribute('aria-expanded', 'false');
            }

            btn.addEventListener('click', () => isOpen ? closeDropdown() : openDropdown());
            searchInput.addEventListener('input', e => renderList(e.target.value));
            dropdown.addEventListener('click', e => e.stopPropagation());
            document.addEventListener('click', e => {
                if (!btn.contains(e.target) && !dropdown.contains(e.target)) closeDropdown();
            });
        };

        initLocationPicker();
        initOtherProjectType();
        reinitializeEnquiryButton();
    }

    /**
     * Explicit Turnstile Rendering
     * ---
     * Called by the Turnstile API via ?onload=renderTurnstile.
     * Finds all .cf-turnstile containers that have NOT been rendered yet,
     * calls turnstile.render() with the site_key from wp_localize_script,
     * and marks them with data-rendered="true" to prevent double-init.
     *
     * This approach survives WP Super Cache static HTML and WooCommerce
     * AJAX fragment replacements because rendering is decoupled from
     * the initial page parse.
     */
    window.renderTurnstile = function () {
        if (typeof turnstile === 'undefined' || typeof btTurnstileObj === 'undefined') {
            return;
        }

        var containers = document.querySelectorAll('.cf-turnstile:not([data-rendered])');
        containers.forEach(function (el) {
            turnstile.render(el, {
                sitekey: btTurnstileObj.site_key,
                theme: el.getAttribute('data-theme') || 'auto',
                callback: function (token) {
                    // Token is auto-injected into a hidden input by the SDK
                    console.log('[Turnstile] Token received.');
                },
                'error-callback': function () {
                    console.error('[Turnstile] Challenge error.');
                },
            });
            el.setAttribute('data-rendered', 'true');
        });
    };

    /**
     * WooCommerce AJAX Integration
     * ---
     * After WooCommerce replaces checkout/cart fragments via AJAX,
     * the Turnstile widget DOM may be destroyed and re-inserted.
     * We listen for these events and re-render any new, un-rendered
     * .cf-turnstile containers.
     */
    (function () {
        if (typeof jQuery !== 'undefined') {
            jQuery(document.body).on('updated_checkout', function () {
                window.renderTurnstile();
            });
            jQuery(document.body).on('updated_cart_totals', function () {
                window.renderTurnstile();
            });
        }
    })();
